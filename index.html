let cities=Array.from(new Map(seed.map(([name,county])=>[name+'|'+county,{name,county}])).values()).sort((a,b)=>a.name.localeCompare(b.name,'ro'));
let data=JSON.parse(localStorage.getItem('rex_data')||'{}'); if(!data.visits)data.visits={}; if(!data.customCities)data.customCities=[]; let page='home',selectedCity=null;
const allCities=()=>[...cities,...data.customCities].sort((a,b)=>a.name.localeCompare(b.name,'ro'));
function save(){localStorage.setItem('rex_data',JSON.stringify(data));render()}
function visitCount(){return Object.values(data.visits).filter(v=>v.visited).length}
function xp(){return Object.values(data.visits).filter(v=>v.visited).reduce((s,v)=>s+100+(v.photo?25:0)+(v.activities?25:0),0)}
function switchPage(p){page=p;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.classList.contains('tab')&&x.dataset.page===p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('sel',x.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(x=>x.addEventListener('click',()=>switchPage(x.dataset.page)));
function render(){document.getElementById('visitedStat').textContent=visitCount();document.getElementById('xpStat').textContent=xp();document.getElementById('percentStat').textContent=Math.round(visitCount()/319*100)+'%';['home','cities','journal','achievements'].forEach(p=>document.getElementById('page-'+p).classList.toggle('hidden',page!==p));if(page==='home')home();if(page==='cities')citylist();if(page==='journal')journal();if(page==='achievements')achievements()}
function home(){let v=visitCount(),pct=Math.min(100,v/319*100);document.getElementById('page-home').innerHTML=`<div class="sectionhead"><h2>Salut, exploratorule! 👋</h2></div><div class="card"><h3>România, aventura ta</h3><p class="small">Ai explorat ${v} din 319 orașe. Fiecare călătorie îți aduce XP și amintiri.</p><div class="progress"><div style="width:${pct}%"></div></div><p class="small">${Math.round(pct)}% din obiectivul de 319 orașe</p><div class="actions"><button class="button" onclick="switchPage('cities')">Explorează orașele</button><button class="button secondary" onclick="switchPage('journal')">Vezi jurnalul</button></div></div><div class="sectionhead"><h2>Următorul obiectiv</h2></div><div class="card"><span class="badge">🏅 Explorator începător</span><h3>${Math.max(0,10-v)} orașe până la următorul nivel</h3><div class="progress"><div style="width:${Math.min(100,v/10*100)}%"></div></div></div><div class="card"><h3>📥 Importă lista completă de orașe</h3><p class="small">Aplicația vine cu un director inițial. Poți adăuga restul orașelor printr-un fișier CSV cu coloanele: <b>oras,judet</b>.</p><label class="photo-label" for="csvImport">Importă CSV cu orașe</label><input id="csvImport" type="file" accept=".csv,text/csv" style="margin-top:8px" onchange="importCSV(this)"></div>`}
function citylist(){let visitedOnly=false;document.getElementById('page-cities').innerHTML=`<div class="sectionhead"><h2>🏙️ Directorul orașelor</h2><span class="pill">${allCities().length} în listă</span></div><input class="search" id="citySearch" placeholder="Caută un oraș..." oninput="filterCities()"><div class="filters"><select id="countyFilter" onchange="filterCities()"><option value="">Toate județele</option>${counties.map(c=>`<option>${c}</option>`).join('')}</select><select id="visitFilter" onchange="filterCities()"><option value="all">Toate statusurile</option><option value="visited">Vizitate</option><option value="unvisited">Nevizitate</option></select></div><div class="card" id="cityResults"></div>`;filterCities()}
function filterCities(){let q=(document.getElementById('citySearch')?.value||'').toLowerCase(),c=document.getElementById('countyFilter')?.value||'',f=document.getElementById('visitFilter')?.value||'all';let list=allCities().filter(city=>city.name.toLowerCase().includes(q)&&(!c||city.county===c)&&(f==='all'||(f==='visited'&&data.visits[city.name]?.visited)||(f==='unvisited'&&!data.visits[city.name]?.visited)));let out=document.getElementById('cityResults');if(!out)return;out.innerHTML=list.map(city=>{let done=data.visits[city.name]?.visited;return `<div class="cityrow"><div class="cityicon">${done?'📍':'🏙️'}</div><div style="flex:1"><div class="cityname">${esc(city.name)}</div><div class="sub">${esc(city.county)} • ${done?'Vizitat':'De explorat'}</div></div>${done?'<span class="pill">✓</span>':''}<button class="button secondary" onclick="openCity('${escJS(city.name)}','${escJS(city.county)}')">${done?'Jurnal':'Detalii'}</button></div>`}).join('')||'<div class="empty">Nu am găsit orașe.</div>'}
function openCity(name,county){selectedCity=name;let v=data.visits[name]||{visited:false,activities:'',rating:5,date:'',photo:''};document.getElementById('page-cities').innerHTML=`<button class="button secondary" onclick="citylist()">← Înapoi la orașe</button><div class="card citydetail"><h2>${esc(name)}</h2><div class="sub">📍 ${esc(county)}</div>${v.photo?`<img class="photo" src="${v.photo}" alt="Fotografie din ${esc(name)}">`:''}<p>${v.visited?'<span class="badge">✓ Oraș vizitat</span>':'<span class="pill">Oraș încă neexplorat</span>'}</p><label>📅 Data vizitei</label><input type="date" id="visitDate" value="${v.date||''}" style="margin:7px 0 14px"><label>📝 Activități și experiențe</label><textarea id="activities" rows="5" placeholder="Ce ai făcut aici? Ce ai vizitat? Ce ți-a plăcut?">${esc(v.activities||'')}</textarea><label style="display:block;margin:14px 0 7px">⭐ Nota experienței: <b id="ratingText">${v.rating||5}/10</b></label><input type="range" min="1" max="10" value="${v.rating||5}" id="rating" oninput="document.getElementById('ratingText').textContent=this.value+'/10'"><label class="photo-label" for="photoInput" style="margin-top:12px">📸 ${v.photo?'Schimbă fotografia':'Atașează fotografie'}</label><input type="file" id="photoInput" accept="image/*" capture="environment" style="margin:8px 0" onchange="loadPhoto(this)"><div class="actions"><button class="button gold" onclick="saveVisit('${escJS(name)}','${escJS(county)}')">${v.visited?'💾 Salvează jurnalul':'✅ Marchează ca vizitat'}</button><button class="button secondary" onclick="toggleVisited('${escJS(name)}')">${v.visited?'Anulează vizita':'Marchează vizitat'}</button></div><p class="footerhint">Fotografiile și jurnalul se salvează local pe acest dispozitiv. Recomandat să exporți backup periodic.</p></div>`}
let pendingPhoto='';function loadPhoto(input){if(!input.files[0])return;let reader=new FileReader();reader.onload=e=>{pendingPhoto=e.target.result;let old=document.querySelector('.photo');if(old)old.src=pendingPhoto;else {let im=document.createElement('img');im.className='photo';im.src=pendingPhoto;input.parentNode.insertBefore(im,input)}};reader.readAsDataURL(input.files[0])}
function saveVisit(name,county){let prev=data.visits[name]||{};data.visits[name]={visited:true,date:document.getElementById('visitDate').value,activities:document.getElementById('activities').value,rating:document.getElementById('rating').value,photo:pendingPhoto||prev.photo||''};pendingPhoto='';save();openCity(name,county)}
function toggleVisited(name){let v=data.visits[name]||{};v.visited=!v.visited;data.visits[name]=v;save();citylist()}
function journal(){let entries=Object.entries(data.visits).filter(([n,v])=>v.visited).sort((a,b)=>(b[1].date||'').localeCompare(a[1].date||''));document.getElementById('page-journal').innerHTML=`<div class="sectionhead"><h2>📔 Jurnalul meu</h2><span class="pill">${entries.length} experiențe</span></div>${entries.map(([name,v])=>{let c=allCities().find(x=>x.name===name);return `<div class="card" onclick="openCity('${escJS(name)}','${escJS(c?.county||'')}');switchPage('cities')"><h3>${esc(name)}</h3><div class="sub">${v.date||'Dată nespecificată'} • ⭐ ${v.rating||'—'}/10</div>${v.photo?`<img class="photo" src="${v.photo}">`:''}<p>${esc(v.activities||'Nu ai adăugat activități.')}</p><span class="pill">+${100+(v.photo?25:0)+(v.activities?25:0)} XP</span></div>`}).join('')||'<div class="empty">Jurnalul tău este gol. Vizitează primul oraș pentru a crea o amintire! 📸</div>'}`}
function achievements(){let n=visitCount(),levels=[{n:1,t:'Primul pas',d:'Vizitează primul oraș',e:'🧭'},{n:5,t:'Weekend explorer',d:'Vizitează 5 orașe',e:'🚗'},{n:10,t:'Explorator începător',d:'Vizitează 10 orașe',e:'🥉'},{n:25,t:'Călător român',d:'Vizitează 25 de orașe',e:'🥈'},{n:50,t:'Aventurier',d:'Vizitează 50 de orașe',e:'🥇'},{n:100,t:'Legenda locală',d:'Vizitează 100 de orașe',e:'💎'},{n:319,t:'România 100%',d:'Completează toate cele 319 orașe',e:'👑'}];document.getElementById('page-achievements').innerHTML=`<div class="sectionhead"><h2>🏆 Insigne și niveluri</h2></div>${levels.map(l=>`<div class="card" style="display:flex;gap:13px;align-items:center"><div style="font-size:34px">${l.e}</div><div style="flex:1"><b>${l.t}</b><div class="sub">${l.d}</div><div class="progress" style="margin-top:8px"><div style="width:${Math.min(100,n/l.n*100)}%"></div></div></div>${n>=l.n?'<span class="pill">Obținut ✓</span>':'<span class="sub">'+n+'/'+l.n+'</span>'}</div>`).join('')}<div class="card"><h3>📦 Backup-ul progresului</h3><p class="small">Exportă datele ca să nu pierzi jurnalul și fotografiile.</p><div class="actions"><button class="button" onclick="exportBackup()">Export backup JSON</button><label class="button secondary" for="backupImport">Import backup</label><input id="backupImport" type="file" accept=".json" hidden onchange="importBackup(this)"></div></div>`}
function importCSV(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=e=>{let rows=e.target.result.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let added=0;rows.slice(1).forEach(row=>{let [name,county]=row.split(',').map(x=>x.trim());if(name&&county&&!allCities().some(c=>c.name===name)){data.customCities.push({name,county});added++}});save();alert(`Import finalizat: ${added} orașe adăugate.`)};reader.readAsText(file)}
function exportBackup(){let blob=new Blob([JSON.stringify(data)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='romania-explorer-backup.json';a.click()}
function importBackup(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{try{data=JSON.parse(e.target.result);save();alert('Backup restaurat!')}catch{alert('Fișier backup invalid')}};r.readAsText(f)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escJS(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></nav></body></html>
