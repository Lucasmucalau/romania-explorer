const STORAGE_KEY='rex_data';
function readSavedData(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return {};const parsed=JSON.parse(raw);return parsed&&typeof parsed==='object'?parsed:{}}catch(e){console.warn('RO Explorer: datele salvate nu au putut fi citite',e);return {}}}
let data=readSavedData(); if(!data.visits)data.visits={}; if(!data.customCities)data.customCities=[]; if(!data.cityCards)data.cityCards={}; if(!data.wishlist)data.wishlist=[]; if(!data.trips)data.trips=[]; let page='home',selectedCity=null;
const allCities=()=>[...cities,...data.customCities].sort((a,b)=>a.name.localeCompare(b.name,'ro'));
function save(){
  const serialized=JSON.stringify(data);
  try{localStorage.setItem(STORAGE_KEY,serialized);localStorage.setItem('rex_last_save',String(Date.now()));}
  catch(e){alert('⚠️ Progresul nu a putut fi salvat în memoria browserului. Verifică spațiul disponibil sau setările browserului.');console.error('RO Explorer save error:',e);}
  render();
}
// Salvare de siguranță la ieșirea din pagină sau când aplicația trece în fundal.
function persistSnapshot(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));localStorage.setItem('rex_missions',JSON.stringify(missionProgress));localStorage.setItem('rex_daily',JSON.stringify(dailyState));localStorage.setItem('rex_last_save',String(Date.now()));}catch(e){console.warn('RO Explorer snapshot save failed',e)}}
window.addEventListener('pagehide',persistSnapshot);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persistSnapshot();});
function visitCount(){return Object.values(data.visits).filter(v=>v.visited).length}
let missionProgress=JSON.parse(localStorage.getItem('rex_missions')||'{}');
let dailyState=JSON.parse(localStorage.getItem('rex_daily')||'{\"date\":\"\",\"tasks\":[],\"completed\":[],\"streak\":0,\"lastComplete\":\"\"}');
const dailyTaskPool=[{id:'visit',title:'Vizitează un oraș nou',desc:'Marchează un oraș ca vizitat',xp:40},{id:'photo',title:'Fotograf de explorare',desc:'Adaugă o fotografie într-un jurnal de oraș',xp:30},{id:'journal',title:'Păstrează amintirea',desc:'Scrie activități sau impresii într-un jurnal',xp:25},{id:'random',title:'Acceptă surpriza',desc:'Alege o destinație din Locație random',xp:20},{id:'county',title:'Explorator de județ',desc:'Vizitează un oraș dintr-un județ nou pentru tine',xp:35},{id:'card',title:'Colecționar',desc:'Deblochează un card de oraș',xp:20}];
function dayKey(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function ensureDaily(){let today=dayKey();if(dailyState.date!==today){let pool=[...dailyTaskPool].sort(()=>Math.random()-.5).slice(0,3);dailyState={...dailyState,date:today,tasks:pool,completed:[],streak:dailyState.streak||0,lastComplete:dailyState.lastComplete||''};localStorage.setItem('rex_daily',JSON.stringify(dailyState));}}
function dailyXP(){let sum=(dailyState.completed||[]).reduce((sum,id)=>sum+(dailyState.tasks.find(t=>t.id===id)?.xp||0),0);return sum+(dailyState.tasks.length===3&&dailyState.completed.length===3?50:0)}
function xp(){return Object.values(data.visits).filter(v=>v.visited).reduce((s,v)=>s+100+(v.photo?25:0)+(v.activities?25:0),0)+Object.values(missionProgress).filter(m=>m.completed).reduce((s,m)=>s+50,0)+dailyXP()}
function switchPage(p){page=p;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.classList.contains('tab')&&x.dataset.page===p));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('sel',x.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(x=>x.addEventListener('click',()=>switchPage(x.dataset.page)));

function guideFor(city){
  const guide=randomCityGuide[city];
  if(guide)return guide;
  return {spots:[`Centrul orașului ${city}`,'Parcul principal sau zona verde locală','Muzeul/monumentul local (dacă există)','Piața centrală sau zona pietonală','Un obiectiv din împrejurimile orașului'],activities:['Explorează centrul la pas','Caută un muzeu sau monument local','Încearcă un preparat specific zonei','Fă un tur foto al orașului','Descoperă un parc și o zonă de relaxare']};
}
let randomDestination=null;
function randomPage(){
  const root=document.getElementById('page-random');
  if(!randomDestination){
    root.innerHTML=`<div class="sectionhead"><h2>🎲 Locație random</h2></div><div class="card"><p>Lasă aplicația să-ți aleagă următoarea aventură în România! Primești un oraș, obiective turistice și idei de activități.</p><div class="actions"><button class="button gold" onclick="pickRandomCity()">🎲 Alege-mi o destinație</button></div></div>`;
  } else {
    const guide=guideFor(randomDestination.name);
    const visited=data.visits[randomDestination.name]?.visited;
    const missionKey=randomDestination.name;
    if(!missionProgress[missionKey])missionProgress[missionKey]={tasks:[false,false,false],completed:false};
    const mission=missionProgress[missionKey];
    const tasks=[`Vizitează 2 obiective: ${guide.spots[0]} și ${guide.spots[1]||guide.spots[0]}`,`Fă o fotografie memorabilă în ${randomDestination.name}`,`Încearcă o activitate locală: ${guide.activities[0]}`];
    const completedCount=mission.tasks.filter(Boolean).length;
    const budget=guide.spots.length>=5?'150–350 lei (excursie de o zi)':'100–250 lei (excursie scurtă)';
    const duration=guide.spots.length>=5?'6–10 ore':'3–6 ore';
    const difficulty=guide.activities.some(a=>/drume|schi|mun|rafting/i.test(a))?'Medie':'Ușoară';
    root.innerHTML=`<div class="sectionhead"><h2>🎲 Locație random</h2></div><div class="card"><span class="badge">🚗 Destinația ta aleasă</span><h2 style="font-size:25px;margin:12px 0 3px">${esc(randomDestination.name)}</h2><div class="sub">📍 Județul ${esc(randomDestination.county)} ${visited?'• Ai vizitat deja acest oraș':'• Oraș nou pentru tine'}</div><p>Transformă această destinație într-o misiune de explorare!</p><div class="grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0"><div class="stat"><b>⏱️ ${duration}</b><span>DURATĂ RECOMANDATĂ</span></div><div class="stat"><b>💰 ${budget}</b><span>BUGET ORIENTATIV</span></div><div class="stat"><b>🎯 ${difficulty}</b><span>DIFICULTATE</span></div><div class="stat"><b>⭐ +50 XP</b><span>RECOMPENSĂ MISIUNE</span></div></div><p class="small">Estimările sunt orientative și nu includ întotdeauna transportul sau cazarea. Distanța va putea fi calculată după ce adăugăm punctul tău de plecare și o funcție de rutare.</p><div class="actions"><button class="button gold" onclick="pickRandomCity()">🎲 Alege alt oraș</button><button class="button secondary" onclick="switchPage('cities');openCity('${escJS(randomDestination.name)}','${escJS(randomDestination.county)}')">📔 Adaugă în jurnal</button></div></div><div class="card"><h3>📸 Obiective turistice</h3><ol>${guide.spots.map(x=>`<li style="margin:8px 0">${esc(x)}</li>`).join('')}</ol></div><div class="card"><h3>🧭 Activități pe care le poți face</h3><ul>${guide.activities.map(x=>`<li style="margin:8px 0">${esc(x)}</li>`).join('')}</ul></div><div class="card"><h3>🎯 Misiunea ta</h3><p>Progres: <b>${completedCount}/3</b> obiective. ${mission.completed?'🏆 Misiune finalizată! Ai primit 50 XP.':'Completează toate obiectivele pentru a primi 50 XP.'}</p><div class="progress"><div style="width:${completedCount/3*100}%"></div></div>${tasks.map((t,i)=>`<label style="display:flex;gap:10px;align-items:flex-start;margin:12px 0"><input type="checkbox" ${mission.tasks[i]?'checked':''} onchange="toggleMissionTask('${escJS(missionKey)}',${i},this.checked)" style="width:auto;margin-top:3px"><span>${esc(t)}</span></label>`).join('')}<p class="small">🎁 Recompensă: 50 XP pentru finalizarea completă a misiunii.</p><button class="button" onclick="switchPage('cities');openCity('${escJS(randomDestination.name)}','${escJS(randomDestination.county)}')">📔 Scrie în jurnal</button></div>`;
  }
}
function toggleMissionTask(city,index,checked){
  if(!missionProgress[city])missionProgress[city]={tasks:[false,false,false],completed:false};
  const xpBefore=xp(),levelBefore=explorerLevel().index;
  missionProgress[city].tasks[index]=checked;
  const was=missionProgress[city].completed;
  missionProgress[city].completed=missionProgress[city].tasks.every(Boolean);
  if(!was&&missionProgress[city].completed){
    const found=allCities().find(c=>c.name===city);
    awardCityCard(city,found?.county||'');
    localStorage.setItem('rex_data',JSON.stringify(data));
  }
  localStorage.setItem('rex_missions',JSON.stringify(missionProgress));
  const xpAfter=xp(),levelAfter=explorerLevel().index;
  if(!was&&missionProgress[city].completed){
    let message=`🏆 Misiune completă pentru ${city}! +50 XP și card de oraș deblocat!`;
    if(levelAfter>levelBefore)message+=`\n🎉 Ai avansat la nivelul ${levelAfter+1}: ${explorerLevel().current.title}! Recompensă: ${explorerLevel().current.reward}`;
    alert(message);
  } else if(was&&!missionProgress[city].completed){
    alert('Progresul misiunii a fost modificat. Bonusul de 50 XP este acordat doar cât timp toate obiectivele sunt bifate.');
  }
  render();
}
function pickRandomCity(){
  const available=allCities().filter(c=>!data.visits[c.name]?.visited);
  const pool=available.length?available:allCities();
  if(!pool.length){randomDestination=null;randomPage();return;}
  randomDestination=pool[Math.floor(Math.random()*pool.length)];
  autoDaily('random');
  randomPage();
}

const explorerLevels=[{xp:0,title:'Explorator începător',emoji:'🥾',desc:'Primii pași în aventura ta',reward:'Titlul oficial: Explorator începător'},{xp:250,title:'Călător',emoji:'🗺️',desc:'Descoperi locuri noi și aduni amintiri',reward:'Insigna Călător + ramă verde pentru profil'},{xp:600,title:'Aventurier',emoji:'🧭',desc:'Explorezi România cu curaj',reward:'Insigna Aventurier + titlu de profil special'},{xp:1200,title:'Explorator veteran',emoji:'🏔️',desc:'Ai acumulat experiență serioasă',reward:'Insigna Veteran + card de profil montan'},{xp:2500,title:'Maestru explorator',emoji:'🌟',desc:'România începe să-ți fie familiară',reward:'Insigna Maestru + temă aurie de profil'},{xp:5000,title:'Legendă a României',emoji:'👑',desc:'Un adevărat campion al explorării',reward:'Insigna Legendă + titlu exclusiv'},{xp:10000,title:'Legenda supremă',emoji:'🇷🇴',desc:'Un nivel de explorare extraordinar',reward:'Insigna supremă + profil tricolor'}];
function explorerLevel(){let total=xp(),idx=0;for(let i=0;i<explorerLevels.length;i++){if(total>=explorerLevels[i].xp)idx=i;}return {current:explorerLevels[idx],next:explorerLevels[idx+1]||null,index:idx,total};}
function render(){document.getElementById('visitedStat').textContent=visitCount();document.getElementById('xpStat').textContent=xp();document.getElementById('percentStat').textContent=Math.round(visitCount()/319*100)+'%';['home','cities','journal','achievements','random','cards','daily','map','wishlist','trips'].forEach(p=>document.getElementById('page-'+p).classList.toggle('hidden',page!==p));if(page==='home')home();if(page==='cities')citylist();if(page==='journal')journal();if(page==='achievements')achievements();if(page==='random')randomPage();if(page==='cards')cardsPage();if(page==='daily')dailyPage();if(page==='map')mapPage();if(page==='wishlist')wishlistPage();if(page==='trips')tripsPage()}

">${dailyState.completed.length}/${dailyState.tasks.length} completate • 🔥 Streak: ${dailyState.streak||0} zile</p><div class="progress"><div style="width:${dailyState.tasks.length?dailyState.completed.length/dailyState.tasks.length*100:0}%"></div></div><button class="button" onclick="switchPage('daily')">Deschide misiunile</button></div><div class="sectionhead"><h2>⭐ Destinațiile mele dorite</h2></div><div class="card"><p class="small">Ai ${data.wishlist.length} orașe în wishlist. Planifică-ți următoarele aventuri!</p><button class="button" onclick="switchPage('wishlist')">Vezi wishlist-ul</button></div><div class="card"><h3>📥 Importă lista completă de orașe</h3><p class="small">Aplicația vine cu un director inițial. Poți adăuga restul orașelor printr-un fișier CSV cu coloanele: <b>oras,judet</b>.</p><label class="photo-label" for="csvImport">Importă CSV cu orașe</label><input id="csvImport" type="file" accept=".csv,text/csv" style="margin-top:8px" onchange="importCSV(this)"></div>`}
function citylist(){let visitedOnly=false;document.getElementById('page-cities').innerHTML=`<div class="sectionhead"><h2>🏙️ Directorul orașelor</h2><span class="pill">${allCities().length} în listă</span></div><input class="search" id="citySearch" placeholder="Caută un oraș..." oninput="filterCities()"><div class="filters"><select id="countyFilter" onchange="filterCities()"><option value="">Toate județele</option>${counties.map(c=>`<option>${c}</option>`).join('')}</select><select id="visitFilter" onchange="filterCities()"><option value="all">Toate statusurile</option><option value="visited">Vizitate</option><option value="unvisited">Nevizitate</option></select></div><div class="card" id="cityResults"></div>`;filterCities()}
function filterCities(){let q=(document.getElementById('citySearch')?.value||'').toLowerCase(),c=document.getElementById('countyFilter')?.value||'',f=document.getElementById('visitFilter')?.value||'all';let list=allCities().filter(city=>city.name.toLowerCase().includes(q)&&(!c||city.county===c)&&(f==='all'||(f==='visited'&&data.visits[city.name]?.visited)||(f==='unvisited'&&!data.visits[city.name]?.visited)));let out=document.getElementById('cityResults');if(!out)return;out.innerHTML=list.map(city=>{let done=data.visits[city.name]?.visited;return `<div class="cityrow"><div class="cityicon">${done?'📍':'🏙️'}</div><div style="flex:1"><div class="cityname">${esc(city.name)}</div><div class="sub">${esc(city.county)} • ${done?'Vizitat':'De explorat'}</div></div>${done?'<span class="pill">✓</span>':''}<button class="button secondary" onclick="openCity('${escJS(city.name)}','${escJS(city.county)}')">${done?'Jurnal':'Detalii'}</button></div>`}).join('')||'<div class="empty">Nu am găsit orașe.</div>'}
function openCity(name,county){selectedCity=name;let v=data.visits[name]||{visited:false,activities:'',rating:5,date:'',photo:''};document.getElementById('page-cities').innerHTML=`<button class="button secondary" onclick="citylist()">← Înapoi la orașe</button><div class="card citydetail"><h2>${esc(name)}</h2><div class="sub">📍 ${esc(county)}</div>${v.photo?`<img class="photo" src="${v.photo}" alt="Fotografie din ${esc(name)}">`:''}<p>${v.visited?'<span class="badge">✓ Oraș vizitat</span>':'<span class="pill">Oraș încă neexplorat</span>'}</p>${randomCityGuide[name]?`<div class="card"><h3>📍 Obiective turistice specifice orașului</h3><ol>${randomCityGuide[name].spots.map(x=>`<li style="margin:7px 0">${esc(x)}</li>`).join('')}</ol><h3>🧭 Experiențe locale</h3><ul>${randomCityGuide[name].activities.map(x=>`<li style="margin:7px 0">${esc(x)}</li>`).join('')}</ul></div>`:`<div class="card"><h3>📍 Ghid turistic în curs de completare</h3><p class="small">Nu afișăm obiective generice sau inventate. Ghidul pentru ${esc(name)} va fi completat cu obiective turistice specifice și verificate.</p></div>`}<label>📅 Data vizitei</label><input type="date" id="visitDate" value="${v.date||''}" style="margin:7px 0 14px"><label>📝 Activități și experiențe</label><textarea id="activities" rows="5" placeholder="Ce ai făcut aici? Ce ai vizitat? Ce ți-a plăcut?">${esc(v.activities||'')}</textarea><label style="display:block;margin:14px 0 7px">⭐ Nota experienței: <b id="ratingText">${v.rating||5}/10</b></label><input type="range" min="1" max="10" value="${v.rating||5}" id="rating" oninput="document.getElementById('ratingText').textContent=this.value+'/10'"><label class="photo-label" for="photoInput" style="margin-top:12px">📸 ${v.photo?'Schimbă fotografia':'Atașează fotografie'}</label><input type="file" id="photoInput" accept="image/*" capture="environment" style="margin:8px 0" onchange="loadPhoto(this)"><div class="actions"><button class="button secondary" onclick="toggleWishlist('${escJS(name)}','${escJS(county)}')">${data.wishlist.some(x=>x.name===name)?'⭐ Elimină din wishlist':'☆ Adaugă în wishlist'}</button><button class="button gold" onclick="saveVisit('${escJS(name)}','${escJS(county)}')">${v.visited?'💾 Salvează jurnalul':'✅ Marchează ca vizitat'}</button><button class="button secondary" onclick="toggleVisited('${escJS(name)}')">${v.visited?'Anulează vizita':'Marchează vizitat'}</button></div><p class="footerhint">Fotografiile și jurnalul se salvează local pe acest dispozitiv. Recomandat să exporți backup periodic.</p></div>`}
let pendingPhoto='';function loadPhoto(input){if(!input.files[0])return;let reader=new FileReader();reader.onload=e=>{pendingPhoto=e.target.result;let old=document.querySelector('.photo');if(old)old.src=pendingPhoto;else {let im=document.createElement('img');im.className='photo';im.src=pendingPhoto;input.parentNode.insertBefore(im,input)}};reader.readAsDataURL(input.files[0])}

const cardRarities=[{key:'common',name:'COMMON',emoji:'🏙️',weight:62},{key:'rare',name:'RARE',emoji:'💠',weight:25},{key:'epic',name:'EPIC',emoji:'🔮',weight:10},{key:'legendary',name:'LEGENDARY',emoji:'👑',weight:3}];
function rollCardRarity(){let roll=Math.random()*100;return roll<62?'common':roll<87?'rare':roll<97?'epic':'legendary'}
function awardCityCard(name,county){if(data.cityCards[name])return;let rarity=rollCardRarity();data.cityCards[name]={name,county,rarity,unlockedAt:new Date().toISOString(),photo:data.visits[name]?.photo||''};localStorage.setItem('rex_data',JSON.stringify(data));}
function cardsPage(){let visited=Object.entries(data.visits).filter(([name,v])=>v.visited);visited.forEach(([name,v])=>{let city=allCities().find(c=>c.name===name);if(!data.cityCards[name])awardCityCard(name,city?.county||'');if(v.photo&&data.cityCards[name]&&!data.cityCards[name].photo)data.cityCards[name].photo=v.photo});let cards=Object.values(data.cityCards);let counts={common:0,rare:0,epic:0,legendary:0};cards.forEach(c=>counts[c.rarity]=(counts[c.rarity]||0)+1);cards.sort((a,b)=>{let rank={legendary:0,epic:1,rare:2,common:3};return rank[a.rarity]-rank[b.rarity]||a.name.localeCompare(b.name)});let rarityLabel={common:'COMMON',rare:'RARE',epic:'EPIC',legendary:'LEGENDARY'};let rarityEmoji={common:'🏙️',rare:'💠',epic:'🔮',legendary:'👑'};document.getElementById('page-cards').innerHTML=`<div class="sectionhead"><h2>🃏 Colecția de orașe</h2><span class="pill">${cards.length} carduri</span></div><div class="card"><h3>📚 Colecționează România</h3><p class="small">Prima vizită într-un oraș îți deblochează un card. Cardurile au rarități diferite și sunt păstrate în colecția ta.</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center">${cardRarities.map(r=>`<div style="background:#f1f5f1;border-radius:10px;padding:8px"><b>${counts[r.key]}</b><div class="small">${r.name}</div></div>`).join('')}</div><p class="small" style="margin-top:10px">🎯 Obiectiv: colecționează cardurile tuturor celor 319 orașe.</p><div class="progress"><div style="width:${Math.min(100,cards.length/319*100)}%"></div></div><p class="small">${cards.length}/319 carduri (${Math.round(cards.length/319*100)}%)</p></div>${cards.length?`<div class="citycards">${cards.map(c=>`<div class="collect-card ${c.rarity}"><div class="rarity">${rarityEmoji[c.rarity]||'🏙️'} ${rarityLabel[c.rarity]||'COMMON'}</div>${c.photo?`<img class="cardphoto" src="${c.photo}" alt="${esc(c.name)}">`:`<div class="cardemoji">${rarityEmoji[c.rarity]||'🏙️'}</div>`}<div class="cardcity">${esc(c.name)}</div><div class="cardcounty">${esc(c.county||'România')}</div><div class="cardxp">🗓️ ${new Date(c.unlockedAt).toLocaleDateString('ro-RO')}</div></div>`).join('')}</div>`:'<div class="empty">Nu ai carduri încă. Marchează primul oraș vizitat și cardul tău va apărea aici! 🃏</div>'}`}

function saveVisit(name,county){let prev=data.visits[name]||{},wasVisited=!!prev.visited,xpBefore=xp(),levelBefore=explorerLevel().index;data.visits[name]={visited:true,date:document.getElementById('visitDate').value,activities:document.getElementById('activities').value,rating:document.getElementById('rating').value,photo:pendingPhoto||prev.photo||''};pendingPhoto='';awardCityCard(name,county);if(!wasVisited){autoDaily('visit');autoDaily('card');if(!Object.entries(data.visits).some(([n,v])=>v.visited&&n!==name&&allCities().find(c=>c.name===n)?.county===county))autoDaily('county')}if(data.visits[name].photo)autoDaily('photo');if(data.visits[name].activities)autoDaily('journal');save();if(!wasVisited){let message=`📍 ${name} adăugat la orașele vizitate! XP total: ${xp()} (+${xp()-xpBefore}).\n🃏 Cardul orașului a fost deblocat.`;if(explorerLevel().index>levelBefore)message+=`\n🎉 Nivel nou: ${explorerLevel().current.title}! Recompensă: ${explorerLevel().current.reward}`;alert(message)}openCity(name,county)}
function toggleVisited(name){let v=data.visits[name]||{},wasVisited=!!v.visited,xpBefore=xp(),levelBefore=explorerLevel().index;v.visited=!v.visited;data.visits[name]=v;if(v.visited){let c=allCities().find(x=>x.name===name);awardCityCard(name,c?.county||'');if(!wasVisited){autoDaily('visit');autoDaily('card');if(!Object.entries(data.visits).some(([n,x])=>x.visited&&n!==name&&allCities().find(z=>z.name===n)?.county===c?.county))autoDaily('county')}}save();if(!wasVisited&&v.visited){let message=`📍 ${name} marcat ca vizitat! +${xp()-xpBefore} XP și card de oraș deblocat.`;if(explorerLevel().index>levelBefore)message+=`\n🎉 Nivel nou: ${explorerLevel().current.title}! Recompensă: ${explorerLevel().current.reward}`;alert(message)}citylist()}
function journal(){let entries=Object.entries(data.visits).filter(([n,v])=>v.visited).sort((a,b)=>(b[1].date||'').localeCompare(a[1].date||''));document.getElementById('page-journal').innerHTML=`<div class="sectionhead"><h2>📔 Jurnalul meu</h2><span class="pill">${entries.length} experiențe</span></div>${entries.map(([name,v])=>{let c=allCities().find(x=>x.name===name);return `<div class="card" onclick="openCity('${escJS(name)}','${escJS(c?.county||'')}');switchPage('cities')"><h3>${esc(name)}</h3><div class="sub">${v.date||'Dată nespecificată'} • ⭐ ${v.rating||'—'}/10</div>${v.photo?`<img class="photo" src="${v.photo}">`:''}<p>${esc(v.activities||'Nu ai adăugat activități.')}</p><span class="pill">+${100+(v.photo?25:0)+(v.activities?25:0)} XP</span></div>`}).join('')||'<div class="empty">Jurnalul tău este gol. Vizitează primul oraș pentru a crea o amintire! 📸</div>'}`}
function achievements(){let n=visitCount(),levels=[{n:1,t:'Primul pas',d:'Vizitează primul oraș',e:'🧭'},{n:5,t:'Weekend explorer',d:'Vizitează 5 orașe',e:'🚗'},{n:10,t:'Explorator începător',d:'Vizitează 10 orașe',e:'🥉'},{n:25,t:'Călător român',d:'Vizitează 25 de orașe',e:'🥈'},{n:50,t:'Aventurier',d:'Vizitează 50 de orașe',e:'🥇'},{n:100,t:'Legenda locală',d:'Vizitează 100 de orașe',e:'💎'},{n:319,t:'România 100%',d:'Completează toate cele 319 orașe',e:'👑'}];document.getElementById('page-achievements').innerHTML=`<div class="sectionhead"><h2>🏆 Insigne și niveluri</h2></div><div class="card"><h3>⭐ Niveluri bazate pe XP</h3><p class="small">XP-ul se câștigă prin orașe vizitate, fotografii, jurnal și misiuni random finalizate.</p>${explorerLevels.map((l,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)"><div style="font-size:27px">${l.emoji}</div><div style="flex:1"><b>Nivel ${i+1} · ${l.title}</b><div class="small">${l.xp} XP necesari</div><div class="small">🎁 ${l.reward}</div></div>${xp()>=l.xp?'<span class="pill">Deblocat ✓</span>':'<span class="small">🔒</span>'}</div>`).join('')}</div>${levels.map(l=>`<div class="card" style="display:flex;gap:13px;align-items:center"><div style="font-size:34px">${l.e}</div><div style="flex:1"><b>${l.t}</b><div class="sub">${l.d}</div><div class="progress" style="margin-top:8px"><div style="width:${Math.min(100,n/l.n*100)}%"></div></div></div>${n>=l.n?'<span class="pill">Obținut ✓</span>':'<span class="sub">'+n+'/'+l.n+'</span>'}</div>`).join('')}<div class="card"><h3>📦 Backup-ul progresului</h3><p class="small">Exportă datele ca să nu pierzi jurnalul și fotografiile.</p><div class="actions"><button class="button" onclick="exportBackup()">Export backup JSON</button><label class="button secondary" for="backupImport">Import backup</label><input id="backupImport" type="file" accept=".json" hidden onchange="importBackup(this)"></div></div>`}

function countyProgressHTML(){let visitedNames=Object.entries(data.visits).filter(([n,v])=>v.visited).map(([n])=>n);let by={};allCities().forEach(c=>{by[c.county]??={total:0,done:0};by[c.county].total++;if(data.visits[c.name]?.visited)by[c.county].done++});let rows=Object.entries(by).filter(([county,x])=>x.done>0).sort((a,b)=>b[1].done-a[1].done||a[0].localeCompare(b[0],'ro')).slice(0,8);return rows.length?rows.map(([county,x])=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><b>${esc(county)}</b><span class="small">${x.done}/${x.total}</span></div><div class="progress"><div style="width:${x.total?x.done/x.total*100:0}%"></div></div></div>`).join(''):'<div class="empty">Încă nu ai vizitat orașe. Primul județ explorat va apărea aici.</div>'}
function mapPage(){let by={};allCities().forEach(c=>{by[c.county]??={total:0,done:0};by[c.county].total++;if(data.visits[c.name]?.visited)by[c.county].done++});let explored=Object.values(by).filter(x=>x.done>0).length;let totalCities=Object.values(by).reduce((a,x)=>a+x.total,0);let visitedCities=Object.values(by).reduce((a,x)=>a+x.done,0);let tiles=counties.map(c=>{let x=by[c]||{total:0,done:0};let cls=x.done===x.total&&x.total>0?'complete':x.done>0?'explored':'';return `<button class="county-tile ${cls}" onclick="openCounty('${escJS(c)}')"><strong>${esc(c)}</strong><span>${x.done}/${x.total} orașe</span></button>`}).join('');document.getElementById('page-map').innerHTML=`<div class="sectionhead"><h2>🗺️ Atlasul exploratorului</h2></div><div class="card"><h3>🇷🇴 Descoperă județele României</h3><p class="small">Selectează un județ pentru a vedea orașele din director și progresul tău. Atlasul este o reprezentare interactivă pe județe, nu o hartă geografică exactă.</p><div class="grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center"><div class="stat"><b>${explored}/42</b><span>JUDEȚE EXPLORATE</span></div><div class="stat"><b>${visitedCities}</b><span>ORAȘE VIZITATE</span></div><div class="stat"><b>${totalCities}</b><span>ORAȘE ÎN LISTĂ</span></div></div><div class="progress" style="margin-top:12px"><div style="width:${Math.min(100,explored/42*100)}%"></div></div><div class="map-legend"><span>⬜ Neexplorat</span><span>🟩 În explorare</span><span>🟨 Complet (lista curentă)</span></div></div><div class="card"><h3>📍 Selectează județul</h3><div class="county-atlas">${tiles}</div></div><div class="card"><h3>🎯 Următoarea provocare</h3><p class="small">Alege un județ în care nu ai vizitat încă niciun oraș și începe să-ți completezi atlasul!</p><button class="button" onclick="switchPage('cities')">Explorează lista de orașe</button></div>`}
function openCounty(county){switchPage('cities');let f=document.getElementById('countyFilter');if(f){f.value=county;filterCities()}}
function dailyPage(){ensureDaily();let tasks=dailyState.tasks||[];let done=dailyState.completed||[];document.getElementById('page-daily').innerHTML=`<div class="sectionhead"><h2>🎯 Misiunile de azi</h2><span class="pill">${done.length}/${tasks.length}</span></div><div class="card"><h3>🔥 Streak Explorer: ${dailyState.streak||0} zile</h3><p class="small">Completează cel puțin o misiune zilnică pentru a păstra streak-ul. Misiunile se reînnoiesc în fiecare zi.</p><div class="progress"><div style="width:${tasks.length?done.length/tasks.length*100:0}%"></div></div><p><b>${dailyXP()} XP</b> câștigați din misiunile de azi</p></div>${tasks.map(t=>`<div class="card"><div style="display:flex;gap:12px;align-items:flex-start"><div style="font-size:30px">${done.includes(t.id)?'✅':'🎯'}</div><div style="flex:1"><b>${esc(t.title)}</b><div class="small">${esc(t.desc)}</div><span class="pill">+${t.xp} XP</span></div></div><div class="small" style="margin-top:10px;font-weight:700;color:${done.includes(t.id)?'var(--green)':'var(--muted)'}">${done.includes(t.id)?'✅ Misiune verificată și completată':'🔒 Se completează automat când realizezi activitatea'}</div></div>`).join('')}<div class="card"><h3>🏅 Bonus zilnic</h3><p>Completează toate cele 3 misiuni și primești încă <b>+50 XP bonus</b>.</p>${done.length===3?'<span class="badge">🎉 Bonus completat! +50 XP</span>':'<div class="small">Mai ai '+(3-done.length)+' misiuni pentru bonus.</div>'}</div>`}
function completeDaily(id){ensureDaily();if(!dailyState.tasks.some(t=>t.id===id)||dailyState.completed.includes(id))return;dailyState.completed.push(id);if(dailyState.completed.length===1){let today=dayKey(),yesterdayDate=new Date();yesterdayDate.setDate(yesterdayDate.getDate()-1);let yesterday=dayKey(yesterdayDate);dailyState.streak=dailyState.lastComplete===yesterday?(dailyState.streak||0)+1:Math.max(1,dailyState.streak||0);dailyState.lastComplete=today;}localStorage.setItem('rex_daily',JSON.stringify(dailyState));persistSnapshot();render()}
function autoDaily(action){ensureDaily();if(dailyState.tasks.some(t=>t.id===action&&!dailyState.completed.includes(action)))completeDaily(action)}

function importCSV(input){let file=input.files[0];if(!file)return;let reader=new FileReader();reader.onload=e=>{let rows=e.target.result.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let added=0;rows.slice(1).forEach(row=>{let [name,county]=row.split(',').map(x=>x.trim());if(name&&county&&!allCities().some(c=>c.name===name)){data.customCities.push({name,county});added++}});save();alert(`Import finalizat: ${added} orașe adăugate.`)};reader.readAsText(file)}
function exportBackup(){let backup={version:3,data,missionProgress,dailyState};let blob=new Blob([JSON.stringify(backup)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='romania-explorer-backup.json';a.click()}
function importBackup(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{try{let parsed=JSON.parse(e.target.result);if(parsed&&parsed.data){data=parsed.data;missionProgress=parsed.missionProgress||{};dailyState=parsed.dailyState||dailyState;localStorage.setItem('rex_missions',JSON.stringify(missionProgress));localStorage.setItem('rex_daily',JSON.stringify(dailyState));}else{data=parsed;missionProgress={};localStorage.setItem('rex_missions','{}');}save();alert('Backup restaurat! Datele orașelor, cardurilor și misiunilor au fost importate.')}catch{alert('Fișier backup invalid')}};r.readAsText(f)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escJS(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function toggleWishlist(name,county){if(!data.wishlist)data.wishlist=[];let i=data.wishlist.findIndex(x=>x.name===name);if(i>=0){data.wishlist.splice(i,1);alert(name+' a fost eliminat din wishlist.')}else{data.wishlist.push({name,county,addedAt:new Date().toISOString()});alert(name+' a fost adăugat în wishlist! ⭐')}save();openCity(name,county)}
function wishlistPage(){let items=data.wishlist||[];document.getElementById('page-wishlist').innerHTML=`<div class="sectionhead"><h2>⭐ Wishlist-ul meu</h2><span class="pill">${items.length} destinații</span></div><div class="card"><h3>Următoarele aventuri</h3><p class="small">Salvează orașele pe care vrei să le vizitezi în viitor. Când ajungi acolo, marchează-le ca vizitate și mută-le din wishlist în jurnalul tău.</p></div>${items.map(x=>`<div class="card"><div style="display:flex;align-items:center;gap:10px"><div style="font-size:28px">⭐</div><div style="flex:1"><b>${esc(x.name)}</b><div class="sub">📍 ${esc(x.county||'România')}</div></div><button class="button secondary" onclick="openCity('${escJS(x.name)}','${escJS(x.county||'')}');switchPage('cities')">Deschide</button></div><div class="actions" style="margin-top:10px"><button class="button gold" onclick="toggleWishlist('${escJS(x.name)}','${escJS(x.county||'')}')">Elimină</button></div></div>`).join('')||'<div class="empty">Wishlist-ul este gol. Deschide un oraș și apasă ☆ pentru a-l salva aici.</div>'}`}


function tripsPage(){let trips=data.trips||[];let cityOptions=allCities().map(c=>`<option value="${esc(c.name)}|${esc(c.county)}">${esc(c.name)} — ${esc(c.county)}</option>`).join('');document.getElementById('page-trips').innerHTML=`<div class="sectionhead"><h2>✈️ Planificatorul de excursii</h2><span class="pill">${trips.length} planuri</span></div><div class="card"><h3>🧳 Creează o excursie nouă</h3><label>Numele excursiei</label><input id="tripTitle" placeholder="Ex: Weekend în Transilvania"><div class="filters"><div style="flex:1"><label>Data plecării</label><input type="date" id="tripStart"></div><div style="flex:1"><label>Data întoarcerii</label><input type="date" id="tripEnd"></div></div><label>Buget estimat (lei)</label><input type="number" id="tripBudget" min="0" placeholder="Ex: 800"><label>Notițe / plan general</label><textarea id="tripNotes" rows="3" placeholder="Transport, cazare, idei..."></textarea><button class="button" onclick="addTrip()">➕ Creează excursia</button></div>${trips.map(t=>`<div class="card"><div style="display:flex;align-items:flex-start;gap:10px"><div style="font-size:30px">🧭</div><div style="flex:1"><h3 style="margin:0">${esc(t.title)}</h3><div class="sub">${t.start?esc(t.start):'Data plecării nealeasă'}${t.end?' → '+esc(t.end):''}</div>${t.budget?`<div class="pill">💰 Buget: ${Number(t.budget).toLocaleString('ro-RO')} lei</div>`:''}</div><button class="button secondary" onclick="deleteTrip(${t.id})">🗑️</button></div>${t.notes?`<p>${esc(t.notes)}</p>`:''}<h4>📍 Itinerariu (${(t.cities||[]).length} opriri)</h4>${(t.cities||[]).length?`<ol>${t.cities.map((c,i)=>`<li style="margin:8px 0"><b>${esc(c.name)}</b> <span class="sub">— ${esc(c.county)}</span> <button class="button secondary" style="padding:5px 8px" onclick="removeTripCity(${t.id},${i})">✕</button></li>`).join('')}</ol>`:'<div class="empty">Adaugă orașe în itinerariu.</div>'}<div class="filters"><select id="tripCity-${t.id}"><option value="">Alege oraș...</option>${cityOptions}</select><button class="button secondary" onclick="addTripCity(${t.id})">➕ Adaugă oprire</button></div></div>`).join('')||'<div class="empty">Nu ai excursii planificate încă. Creează prima aventură! 🚗</div>'}<div class="card"><h3>💡 Sfat</h3><p class="small">Planificatorul păstrează itinerariul și notițele pe dispozitivul tău. Poți exporta backup-ul din secțiunea Insigne pentru a păstra datele.</p></div>`}
function addTrip(){let title=document.getElementById('tripTitle').value.trim();if(!title){alert('Introdu un nume pentru excursie.');return}let start=document.getElementById('tripStart').value,end=document.getElementById('tripEnd').value;if(start&&end&&end<start){alert('Data întoarcerii trebuie să fie după plecare.');return}data.trips.push({id:Date.now(),title,start,end,budget:document.getElementById('tripBudget').value,notes:document.getElementById('tripNotes').value.trim(),cities:[],createdAt:new Date().toISOString()});save();}
function addTripCity(id){let sel=document.getElementById('tripCity-'+id);if(!sel||!sel.value)return;let [name,county]=sel.value.split('|');let trip=data.trips.find(t=>t.id===id);if(!trip)return;trip.cities=trip.cities||[];if(trip.cities.some(c=>c.name===name)){alert('Orașul este deja în itinerariu.');return}trip.cities.push({name,county});save();}
function removeTripCity(id,index){let trip=data.trips.find(t=>t.id===id);if(trip&&trip.cities){trip.cities.splice(index,1);save()}}
function deleteTrip(id){if(!confirm('Ștergi acest plan de excursie?'))return;data.trips=data.trips.filter(t=>t.id!==id);save()}

ensureDaily();persistSnapshot();render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></nav></body></html>
